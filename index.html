<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Parallax Starry Background -->
  <div class="stars stars1"></div>
  <div class="stars stars2"></div>
  <div class="stars stars3"></div>

  <!-- Back to Top Button -->
  <button id="backToTop" title="Go to top">↑</button>

  <header>
    <nav class="navbar">
      <h1 class="logo">🚀 YourName</h1>
      <ul class="nav-links">
        <li><a href="#home"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="#about"><i class="fas fa-user"></i> About</a></li>
        <li><a href="#projects"><i class="fas fa-code"></i> Projects</a></li>
        <li><a href="#skills"><i class="fas fa-tools"></i> Skills</a></li>
        <li><a href="#contact"><i class="fas fa-envelope"></i> Contact</a></li>
        <li><button id="theme-toggle">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home" class="section">
      <h2>Welcome!</h2>
      <p>This is my personal portfolio.</p>
    </section>

    <section id="about" class="section">
      <h2>About Me</h2>
      <p>Write a short intro about yourself.</p>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <p>Showcase your work with links or images.</p>
    </section>

    <section id="skills" class="section">
      <h2>Skills</h2>
      <p>List your technical skills.</p>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p>Email: you@example.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Your Name</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
